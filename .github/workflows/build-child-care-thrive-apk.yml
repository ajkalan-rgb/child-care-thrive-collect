name: Build Child-Care Thrive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KOBOCOLLECT_REPO: https://github.com/kobotoolbox/collect.git
  KOBOCOLLECT_REF: master
  REQUIRE_BRANDING_ASSETS: true
  KOBOTOOLBOX_COLLECT_URL: https://kc.kobotoolbox.org/

jobs:
  build:
    name: Build branded ODK/KoboCollect APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Child-Care Thrive wrapper
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify required branding assets
        run: |
          echo "Wrapper repository contents:"
          find . -maxdepth 3 -type f | sort
          echo "Branding folder contents:"
          find branding -maxdepth 2 -type f -print 2>/dev/null || true
          test -f branding/child_care_icon.png || (echo "ERROR: Missing branding/child_care_icon.png" && exit 1)
          test -f branding/child_care_startup.png || (echo "ERROR: Missing branding/child_care_startup.png" && exit 1)
          test -f branding/Updated_background.png || (echo "ERROR: Missing branding/Updated_background.png" && exit 1)

      - name: Clone KoboCollect source
        run: |
          git clone --depth 1 --branch "$KOBOCOLLECT_REF" "$KOBOCOLLECT_REPO" upstream-collect

      - name: Apply Child-Care Thrive branding patch
        run: |
          cp scripts/apply_child_care_thrive_branding.py upstream-collect/apply_child_care_thrive_branding.py
          python3 -c "from pathlib import Path; p=Path('upstream-collect/apply_child_care_thrive_branding.py'); s=p.read_text(); s=s.replace('SERVER_URL = \"https://kf.kobotoolbox.org\"', 'SERVER_URL = \"https://kc.kobotoolbox.org/\"'); p.write_text(s)"
          grep -n 'SERVER_URL =' upstream-collect/apply_child_care_thrive_branding.py
          cp -R branding upstream-collect/branding
          cd upstream-collect
          cp branding/Updated_background.png branding/child_care_splash.png
          python3 apply_child_care_thrive_branding.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          menu = Path('collect_app/src/main/res/menu/main_menu.xml')
          menu.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto">
              <item
                  android:id="@+id/projects"
                  android:icon="@drawable/ic_outline_settings_accent_24"
                  android:title="@string/project_settings"
                  app:showAsAction="always" />
          </menu>
          ''')

          main_layout = Path('collect_app/src/main/res/layout/main_menu.xml')
          s = main_layout.read_text()
          s = s.replace('android:layout_marginTop="132dp"', 'android:layout_marginTop="220dp"')
          s = s.replace('android:layout_marginTop="180dp"', 'android:layout_marginTop="220dp"')
          s = s.replace('android:layout_marginTop="@dimen/margin_extra_small"', 'android:layout_marginTop="220dp"', 1)
          main_layout.write_text(s)

          mm = Path('collect_app/src/main/java/org/odk/collect/android/mainmenu/MainMenuFragment.kt')
          s = mm.read_text()
          if 'ProjectPreferencesActivity' not in s:
              s = s.replace('import org.odk.collect.android.projects.ProjectSettingsDialog\n', 'import org.odk.collect.android.projects.ProjectSettingsDialog\nimport org.odk.collect.android.preferences.screens.ProjectPreferencesActivity\n')
          s = s.replace('requireActivity().title = project.name', 'requireActivity().title = ""')
          s = re.sub(
              r'    override fun onPrepareOptionsMenu\(menu: Menu\) \{.*?\n    \}\n\n    override fun onCreateOptionsMenu',
              '    override fun onPrepareOptionsMenu(menu: Menu) {\n        val settingsItem = menu.findItem(org.odk.collect.android.R.id.projects)\n        settingsItem.isVisible = true\n        settingsItem.title = getString(org.odk.collect.strings.R.string.project_settings)\n    }\n\n    override fun onCreateOptionsMenu',
              s,
              flags=re.DOTALL,
          )
          s = re.sub(
              r'        if \(item.itemId == org\.odk\.collect\.android\.R\.id\.projects\) \{.*?\n        \}\n\n        return super\.onOptionsItemSelected\(item\)',
              '        if (item.itemId == org.odk.collect.android.R.id.projects) {\n            startActivity(Intent(requireContext(), ProjectPreferencesActivity::class.java))\n            return true\n        }\n\n        return super.onOptionsItemSelected(item)',
              s,
              flags=re.DOTALL,
          )
          s = re.sub(
              r'    private fun initToolbar\(binding: MainMenuBinding\) \{.*?\n    \}\n\n    private fun initMapbox',
              '    private fun initToolbar(binding: MainMenuBinding) {\n        binding.root.findViewById<View>(org.odk.collect.androidshared.R.id.appBarLayout)?.visibility = View.VISIBLE\n        val toolbar = binding.root.findViewById<Toolbar>(org.odk.collect.androidshared.R.id.toolbar)\n        toolbar.visibility = View.VISIBLE\n        (requireActivity() as AppCompatActivity).setSupportActionBar(toolbar)\n        (requireActivity() as AppCompatActivity).supportActionBar?.setDisplayShowTitleEnabled(false)\n    }\n\n    private fun initMapbox',
              s,
              flags=re.DOTALL,
          )
          mm.write_text(s)

          prefs = Path('collect_app/src/main/java/org/odk/collect/android/preferences/screens/ProjectPreferencesFragment.kt')
          s = prefs.read_text()
          s = s.replace('''            PROTOCOL_PREFERENCE_KEY,
            UNLOCK_PROTECTED_SETTINGS_PREFERENCE_KEY,''', '''            PROTOCOL_PREFERENCE_KEY,
            USER_AND_DEVICE_IDENTITY_PREFERENCE_KEY,
            EXPERIMENTAL_PREFERENCE_KEY,
            ACCESS_CONTROL_PREFERENCE_KEY,
            UNLOCK_PROTECTED_SETTINGS_PREFERENCE_KEY,''')
          s = re.sub(
              r'    override fun onPrepareOptionsMenu\(menu: Menu\) \{.*?\n    \}\n\n    override fun onCreateView',
              '    override fun onPrepareOptionsMenu(menu: Menu) {\n        menu.findItem(R.id.menu_locked).isVisible = false\n        menu.findItem(R.id.menu_unlocked).isVisible = false\n    }\n\n    override fun onCreateView',
              s,
              flags=re.DOTALL,
          )
          prefs.write_text(s)

          access_xml = Path('collect_app/src/main/res/xml/access_control_preferences.xml')
          access_xml.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <PreferenceScreen xmlns:android="http://schemas.android.com/apk/res/android"
              android:title="@string/access_control_section_title" />
          ''')

          user_settings_xml = Path('collect_app/src/main/res/xml/user_settings_access_preferences.xml')
          s = user_settings_xml.read_text()
          for key in ['change_server', 'analytics']:
              s = re.sub(r'\n\s*<CheckBoxPreference\b(?=[^>]*android:key="' + re.escape(key) + r'")[^>]*/>', '', s, flags=re.DOTALL)
          user_settings_xml.write_text(s)

          defaults = Path('collect_app/src/main/java/org/odk/collect/android/preferences/Defaults.kt')
          s = defaults.read_text()
          s = s.replace('hashMap[ProjectKeys.KEY_CONSTRAINT_BEHAVIOR] = ProjectKeys.CONSTRAINT_BEHAVIOR_ON_SWIPE', 'hashMap[ProjectKeys.KEY_CONSTRAINT_BEHAVIOR] = "on_finalize"')
          s = s.replace('hashMap[ProjectKeys.KEY_ANALYTICS] = true', 'hashMap[ProjectKeys.KEY_ANALYTICS] = false')
          if 'defaults[ProtectedProjectKeys.KEY_CHANGE_SERVER] = false' not in s:
              s = s.replace('''            }

            return defaults''', '''            }
            defaults[ProtectedProjectKeys.KEY_CHANGE_SERVER] = false
            defaults[ProtectedProjectKeys.KEY_ANALYTICS] = false

            return defaults''')
          defaults.write_text(s)

          generator = Path('collect_app/src/main/java/org/odk/collect/android/configure/qr/AppConfigurationGenerator.kt')
          s = generator.read_text()
          if 'ProjectKeys.KEY_CONSTRAINT_BEHAVIOR' not in s.split('return JSONObject().apply')[0]:
              s = s.replace('put(ProjectKeys.KEY_PASSWORD, password)', 'put(ProjectKeys.KEY_PASSWORD, password)\n            put(ProjectKeys.KEY_ANALYTICS, false)\n            put(ProjectKeys.KEY_CONSTRAINT_BEHAVIOR, "on_finalize")')
          s = s.replace('put(AppConfigurationKeys.ADMIN, JSONObject())', 'put(AppConfigurationKeys.ADMIN, JSONObject().apply {\n                put(ProtectedProjectKeys.KEY_CHANGE_SERVER, false)\n                put(ProtectedProjectKeys.KEY_ANALYTICS, false)\n            })')
          generator.write_text(s)
          PY
          python3 ../scripts/ui_patch.py
          python3 ../scripts/force_first_launch_startup.py
          python3 ../scripts/use_updated_background_startup.py
          grep -R "https://kf.kobotoolbox.org" collect_app/src/main/java collect_app/src/main/res -n && exit 1 || true
          echo "Generated/brand Android resources:"
          find collect_app/src/main/res -type f \( -name '*child_care*' -o -name 'ic_launcher*' \) | sort | head -200
          echo "Remaining Kobo/ODK labels after patch, for review only:"
          grep -R "KoboCollect\|Kobo Collect\|ODK Collect" strings/src/main/res collect_app/src/main/res -n | head -50 || true

      - name: Make Gradle wrapper executable
        run: chmod +x upstream-collect/gradlew

      - name: List available Gradle assemble tasks
        working-directory: upstream-collect
        run: |
          ./gradlew tasks --all --no-daemon > ../gradle-tasks.txt || true
          grep -i "assemble" ../gradle-tasks.txt | head -200 || true

      - name: Build APK with diagnostics
        working-directory: upstream-collect
        run: |
          set +e
          echo "Trying self-signed release build first..." | tee ../gradle-build.log
          ./gradlew :collect_app:assembleSelfSignedRelease --stacktrace --no-daemon 2>&1 | tee -a ../gradle-build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "selfSignedRelease failed with status $STATUS. Trying debug build fallback..." | tee -a ../gradle-build.log
            ./gradlew :collect_app:assembleDebug --stacktrace --no-daemon 2>&1 | tee -a ../gradle-build.log
            STATUS=${PIPESTATUS[0]}
          fi

          echo "Final build status: $STATUS" | tee -a ../gradle-build.log
          exit "$STATUS"

      - name: Collect APK outputs
        if: always()
        run: |
          mkdir -p apk-output diagnostics
          find upstream-collect/collect_app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} apk-output/ \; || true
          cp gradle-build.log diagnostics/ 2>/dev/null || true
          cp gradle-tasks.txt diagnostics/ 2>/dev/null || true
          find upstream-collect/collect_app/build/outputs -type f | sort > diagnostics/build-outputs-file-list.txt 2>/dev/null || true
          ls -la apk-output || true
          ls -la diagnostics || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-care-thrive-apk
          path: apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-care-thrive-build-diagnostics
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 14
